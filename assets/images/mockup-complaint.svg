      <rect x="620" y="14" width="90" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" />
      <text x="665" y="30" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">RESOLVED</text>
