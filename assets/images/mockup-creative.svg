<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="60%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#030406" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ccff00" />
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="url(#bgGrad3)" />

  <!-- Abstract Kinetic Curves / Lines -->
  <g opacity="0.25" stroke="url(#meshGrad)" stroke-width="1.5" fill="none">
    <path d="M 0 200 C 300 100, 600 450, 1200 250" />
    <path d="M 0 240 C 320 140, 620 490, 1200 290" />
    <path d="M 0 280 C 340 180, 640 530, 1200 330" />
    <path d="M 0 320 C 360 220, 660 570, 1200 370" />
    <path d="M 0 360 C 380 260, 680 610, 1200 410" />
  </g>

  <!-- Window Container -->
  <rect x="70" y="45" width="1060" height="660" rx="18" fill="rgba(15, 18, 25, 0.75)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Top Bar -->
  <circle cx="105" cy="75" r="5" fill="#ff5f56" />
  <circle cx="123" cy="75" r="5" fill="#ffbd2e" />
  <circle cx="141" cy="75" r="5" fill="#27c93f" />
  <text x="600" y="80" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">experiment.bexo.io/threejs/kinetic-mesh-v4</text>
  <line x1="70" y1="105" x2="1130" y2="105" stroke="rgba(255,255,255,0.08)" />

  <!-- Center Editorial Headline inside the mockup -->
  <g transform="translate(130, 200)">
    <text x="0" y="0" fill="#ffffff" font-family="'Syne', -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">HYPER</text>
    <text x="0" y="65" fill="url(#meshGrad)" font-family="'Syne', -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">DIMENSION</text>
    <text x="0" y="110" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16" max-width="300">A sensory exploration into realtime shader morphing and kinetic spatial interaction.</text>
    
    <!-- Micro Button -->
    <rect x="0" y="145" width="180" height="42" rx="21" fill="#00f0ff" />
    <text x="90" y="171" fill="#07080a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">LAUNCH RUNTIME ↗</text>
  </g>

  <!-- 3D Wireframe Icosahedron Projection in Mockup -->
  <g transform="translate(820, 360)" filter="url(#neonGlow)">
    <!-- Wireframe Facets -->
    <polygon points="0,-160 135,-45 85,120 -85,120 -135,-45" fill="none" stroke="#00f0ff" stroke-width="2" />
    <polygon points="0,-160 0,60 135,-45" fill="rgba(0,240,255,0.08)" stroke="#c084fc" stroke-width="1.5" />
    <polygon points="0,-160 -135,-45 0,60" fill="rgba(192,132,252,0.08)" stroke="#00f0ff" stroke-width="1.5" />
    <polygon points="0,60 135,-45 85,120" fill="rgba(204,255,0,0.08)" stroke="#ccff00" stroke-width="1.5" />
    <polygon points="0,60 85,120 -85,120" fill="rgba(0,240,255,0.1)" stroke="#00f0ff" stroke-width="1.5" />
    <polygon points="0,60 -85,120 -135,-45" fill="rgba(192,132,252,0.08)" stroke="#c084fc" stroke-width="1.5" />

    <!-- Vertices -->
    <circle cx="0" cy="-160" r="5" fill="#ffffff" />
    <circle cx="135" cy="-45" r="5" fill="#ffffff" />
    <circle cx="85" cy="120" r="5" fill="#ffffff" />
    <circle cx="-85" cy="120" r="5" fill="#ffffff" />
    <circle cx="-135" cy="-45" r="5" fill="#ffffff" />
    <circle cx="0" cy="60" r="6" fill="#00f0ff" />
  </g>

  <!-- Telemetry Overlay in Mockup -->
  <g transform="translate(130, 520)" font-family="monospace" font-size="11">
    <rect x="0" y="0" width="160" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="15" y="25" fill="#64748b">RENDER FPS</text>
    <text x="15" y="47" fill="#22c55e" font-size="16" font-weight="bold">60.0 FPS</text>

    <rect x="180" y="0" width="160" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="195" y="25" fill="#64748b">TRIANGLES</text>
    <text x="195" y="47" fill="#00f0ff" font-size="16" font-weight="bold">42,800</text>

    <rect x="360" y="0" width="160" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="375" y="25" fill="#64748b">SHADER PASS</text>
    <text x="375" y="47" fill="#c084fc" font-size="16" font-weight="bold">RAYMARCH</text>
  </g>
</svg>
