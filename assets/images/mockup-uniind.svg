    <line x1="720" y1="0" x2="720" y2="750" />
    <line x1="960" y1="0" x2="960" y2="750" />
  </g>

  <!-- App Window Frame -->
  <rect x="60" y="40" width="1080" height="670" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="drop-shadow(0 25px 40px rgba(0,0,0,0.8))" />
  
  <!-- Window Header Bar -->
  <path d="M 60 56 Q 60 40 76 40 L 1124 40 Q 1140 40 1140 56 L 1140 95 L 60 95 Z" fill="#131720" />
