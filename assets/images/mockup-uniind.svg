  <circle cx="115" cy="68" r="6" fill="#ffbd2e" />
  <circle cx="135" cy="68" r="6" fill="#27c93f" />
  
  <rect x="420" y="54" width="360" height="28" rx="14" fill="#090b0e" stroke="rgba(255,255,255,0.08)" />
