  <text x="90" y="145" fill="#00f0ff" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold">UNIIND // AI</text>
  <text x="90" y="165" fill="#58a6ff" font-family="monospace" font-size="10" letter-spacing="1">COLLABORATIVE ENGINE</text>

