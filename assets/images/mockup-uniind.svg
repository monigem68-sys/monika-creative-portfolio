    <g transform="translate(540, 345)">
      <rect x="0" y="0" width="200" height="65" rx="8" fill="#0e1219" stroke="rgba(255,255,255,0.05)" />
      <circle cx="20" cy="22" r="8" fill="#ec4899" />
      <text x="35" y="26" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Mentor Match</text>
      <text x="15" y="48" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">Matched with IIT Madras</text>
