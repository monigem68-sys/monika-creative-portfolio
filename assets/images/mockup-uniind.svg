      <text x="35" y="26" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Solution Deployed</text>
      <text x="15" y="48" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">Water distribution v1.4</text>
